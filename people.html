<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="The people bringing queer scholarship and community together through the Queer Research Network.">
  <meta name="theme-color" content="#28123d">
  <title>People | Queer Research Network</title>
  <link rel="icon" type="image/png" href="assets/queer_research_hub_logo_only.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="people.css">
  <!-- Do not load database.js on this page. -->
</head>
<body>
  <a class="skip-link" href="#main-content">Skip to content</a>
  <div id="header-container"></div>
  <script src="/header.js" defer></script>

  <main class="people-page" id="main-content">
    <section class="people-hero" aria-labelledby="people-title">
      <div class="wrap people-hero-grid">
        <div>
          <h1 id="people-title">Meet the network.</h1>
        </div>
        <div class="people-intro">
          <p>The people bringing queer scholarship and community together,
            across disciplines and beyond.</p>
          <a class="button button-outline" href="submit-profile.html">
            Add your researcher profile ↗
          </a>
        </div>
      </div>
    </section>

    <section class="people-directory" aria-labelledby="directory-title">
      <h2 id="directory-title" class="sr-only">People directory</h2>
      <p class="sr-only" id="result-count" role="status" aria-live="polite" aria-atomic="true">Loading people…</p>
      <form class="people-search-form" role="search" aria-label="Search the people directory">
        <label for="people-search">Search people</label>
        <div class="people-search-input">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
            <circle cx="10.5" cy="10.5" r="6.5"></circle>
            <path d="m16 16 4.5 4.5"></path>
          </svg>
          <input id="people-search" type="search" placeholder="Name, institution, or keyword" autocomplete="off" aria-controls="people-grid" disabled>
        </div>
      </form>
      <div class="people-grid" id="people-grid" aria-busy="true">
        <p class="people-loading">Loading the people behind the network…</p>
      </div>
      <noscript><p>Please enable JavaScript to load the people directory.</p></noscript>
    </section>
  </main>

  <div id="footer-container"></div>
  <script src="/footer.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    (() => {
      'use strict';

      const SUPABASE_URL = 'https://shgbntwormbquafuezby.supabase.co';
      const SUPABASE_PUBLISHABLE_KEY = 'sb_publishable_yAWT43eYKO_23L4CzjHpew_2Hsotj89';

      const grid = document.getElementById('people-grid');
      const count = document.getElementById('result-count');
      const search = document.getElementById('people-search');
      let people = [], client;

      // Shared header is loaded by header.js; no page-specific header listeners here.
      const normalize = value => String(value || '')
        .normalize('NFD')
        .replace(/[\u0300-\u036f]/g, '')
        .toLocaleLowerCase('en-CA');
      const escapeHTML = value => String(value ?? '')
        .replace(/[&<>"']/g, char => ({
          '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;'
        }[char]));

      function safeUrl(value) {
        if (!value) return null;
        try {
          const url = new URL(value, window.location.href);
          if (url.protocol === 'http:' || url.protocol === 'https:') return url.href;
        } catch (error) {
          console.warn('Invalid URL:', value);
        }
        return null;
      }

      function getInitials(name = '') {
        return name.trim().split(/\s+/).slice(0, 2)
          .map(part => part[0]).join('').toUpperCase();
      }

      function getFirstName(name = '') {
        return name.trim().split(/\s+/)[0] || 'this researcher';
      }

      function makeTagHTML(tags = []) {
        if (!tags.length) return '';
        return tags.map(tag => `<span>${escapeHTML(tag.name)}</span>`).join('');
      }

      function makePersonLinks(person) {
        const links = [];
        const website = safeUrl(person.website_url);
        const orcid = safeUrl(person.orcid_url);
        const linkedin = safeUrl(person.linkedin_url);

        if (website) {
          links.push(`<a href="${escapeHTML(website)}" target="_blank" rel="noopener noreferrer">Website ↗</a>`);
        }
        if (orcid) {
          links.push(`<a href="${escapeHTML(orcid)}" target="_blank" rel="noopener noreferrer">ORCID ↗</a>`);
        }
        if (linkedin) {
          links.push(`<a href="${escapeHTML(linkedin)}" target="_blank" rel="noopener noreferrer">LinkedIn ↗</a>`);
        }
        return links.length ? `<div class="person-links">${links.join('')}</div>` : '';
      }

      function makeCard(person) {
        const tags = (person.person_tags || [])
          .map(item => item.tags)
          .filter(Boolean)
          .sort((a, b) => a.name.localeCompare(b.name));

        const name = escapeHTML(person.display_name);
        const pronouns = person.pronouns
          ? ` (${escapeHTML(person.pronouns)})` : '';

        const roleParts = [];
        if (person.is_founder) roleParts.push('Co-founder');
        if (person.role_type) roleParts.push(person.role_type);
        else if (person.title) roleParts.push(person.title);
        const role = roleParts.map(escapeHTML).join(' · ');

        let photo = safeUrl(person.photo_url);
        if (!photo && person.photo_path) {
          const { data } = client.storage
            .from('qrn-images')
            .getPublicUrl(person.photo_path);
          photo = safeUrl(data?.publicUrl);
        }

        const portraitHTML = photo
          ? `<div class="person-portrait">
               <img class="person-photo" src="${escapeHTML(photo)}"
                    alt="Portrait of ${name}" loading="lazy" />
             </div>`
          : `<div class="person-portrait" aria-hidden="true">
               <span>${escapeHTML(getInitials(person.display_name))}</span>
             </div>`;

        const bio = person.bio || person.short_bio;
        const bioHTML = bio
          ? `<details class="person-bio">
               <summary>About ${escapeHTML(getFirstName(person.display_name))}
                 <span aria-hidden="true">↓</span>
               </summary>
               <div class="person-bio-content">
                 <p>${escapeHTML(bio)}</p>
                 ${makePersonLinks(person)}
               </div>
             </details>`
          : '';

        return `
          <article class="person-card" id="person-${escapeHTML(person.slug)}">
            ${portraitHTML}
            <div class="person-card-content">
              ${role ? `<p class="person-role">${role}</p>` : ''}
              <h3>${name}${pronouns}</h3>
              ${tags.length
                ? `<div class="tag-list" aria-label="Research interests">${makeTagHTML(tags)}</div>`
                : ''}
              ${bioHTML}
            </div>
          </article>
        `;
      }

      function attachPhotoFallbacks() {
        grid.querySelectorAll('.person-photo').forEach(image => {
          const fallback = () => {
            const portrait = image.parentElement;
            const name = portrait.closest('.person-card').querySelector('h3').textContent;
            image.remove();
            portrait.setAttribute('aria-hidden', 'true');
            const span = document.createElement('span');
            span.textContent = getInitials(name);
            portrait.replaceChildren(span);
          };
          image.addEventListener('error', fallback, { once: true });
          if (image.complete && !image.naturalWidth) fallback();
        });
      }

      function render() {
        const terms = normalize(search.value).trim().split(/\s+/).filter(Boolean);
        const matches = people.filter(person => {
          const haystack = normalize([
            person.display_name, person.pronouns, person.role_type,
            person.title, person.institution, person.faculty,
            person.department, person.bio, person.short_bio,
            ...(person.person_tags || []).map(item => item.tags?.name)
          ].filter(Boolean).join(' '));
          return terms.every(term => haystack.includes(term));
        });

        count.textContent = `${matches.length} ${matches.length === 1 ? 'person' : 'people'}`
          + (terms.length ? ` of ${people.length}` : '');
        grid.innerHTML = matches.length
          ? matches.map(makeCard).join('')
          : `<div class="people-state">
               <h3>${people.length ? 'No matches just yet.' : 'Meet us here soon.'}</h3>
               <p>${people.length
                 ? 'Try another name or keyword, or clear your search.'
                 : 'Published profiles will appear here as people join the directory.'}</p>
             </div>`;
        attachPhotoFallbacks();
      }

      function scrollToProfile() {
        try {
          const id = decodeURIComponent(window.location.hash.slice(1));
          if (id.startsWith('person-')) {
            document.getElementById(id)?.scrollIntoView({ block: 'start' });
          }
        } catch { /* Ignore malformed fragments. */ }
      }

      async function loadPeople() {
        search.disabled = true;
        grid.setAttribute('aria-busy', 'true');
        grid.innerHTML = '<p class="people-loading">Loading the people behind the network…</p>';
        count.textContent = 'Loading people…';
        try {
          if (!window.supabase?.createClient) {
            throw new Error('Supabase library could not be loaded.');
          }
          client ||= window.supabase.createClient(
            SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY,
            { auth: { persistSession: false, autoRefreshToken: false, detectSessionInUrl: false } }
          );

          const selection = `
            id, slug, display_name, pronouns, role_type, title,
            institution, faculty, department, short_bio, bio,
            website_url, orcid_url, linkedin_url, photo_url,
            photo_path, is_founder, is_featured, display_order,
            person_tags ( tags ( id, name, slug, category ) )
          `;

          const all = [], pageSize = 500;
          let from = 0;
          while (true) {
            const { data, error } = await client.from('people').select(selection)
              .eq('status', 'published')
              .order('display_order', { ascending: true })
              .order('display_name', { ascending: true })
              .order('id', { ascending: true })
              .range(from, from + pageSize - 1);
            if (error) throw error;
            all.push(...(data || []));
            if (!data || data.length < pageSize) break;
            from += pageSize;
          }

          people = all;
          search.disabled = false;
          render();
          scrollToProfile();
        } catch (error) {
          console.error('Could not load the people directory:', error);
          count.textContent = 'People are temporarily unavailable.';
          grid.innerHTML = `<div class="people-state">
            <h3>Let’s try that again.</h3>
            <p>We couldn’t load the directory. Please try again in a moment.</p>
            <button class="button" id="retry-people" type="button">Try again</button>
          </div>`;
          document.getElementById('retry-people').addEventListener('click', () => {
            if (window.supabase?.createClient) loadPeople();
            else window.location.reload();
          });
        } finally {
          grid.setAttribute('aria-busy', 'false');
        }
      }

      document.querySelector('.people-search-form')
        .addEventListener('submit', event => event.preventDefault());
      search.addEventListener('input', render);
      window.addEventListener('hashchange', scrollToProfile);
      loadPeople();
    })();
  </script>
</body>
</html>
